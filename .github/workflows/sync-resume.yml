name: Sync resume PDF

on:
  push:
    paths:
      - 'public/Farhan-Tahmid-Resume.docx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Convert DOCX to PDF
        run: |
          libreoffice --headless --convert-to pdf --outdir public public/Farhan-Tahmid-Resume.docx
          mv -f public/Farhan-Tahmid-Resume.pdf public/resume.pdf

      - name: Commit updated PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync resume.pdf from Farhan-Tahmid-Resume.docx'
          file_pattern: public/resume.pdf
